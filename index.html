<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday Ayushi ♥</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#303236;
    font-family:Arial,Helvetica,sans-serif;
}

.scene{
    width:100vw;
    height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 44%,rgba(255,255,255,.025),transparent 35%),
      #303236;
    cursor:pointer;
}


/* ================= CAKE AREA ================= */

.cake-container{
    position:relative;
    width:320px;
    height:270px;
    transform:translateY(-10px);
}

.cake{
    position:absolute;
    width:250px;
    height:230px;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
}


/* ================= CAKE PIECES ================= */

.layer{
    position:absolute;
    left:50%;
    width:160px;
    height:19px;
    transform:translateX(-50%) translateY(-220px);
    border-radius:6px 6px 3px 3px;
    opacity:0;

    background:
      linear-gradient(
        to bottom,
        #fff2d0 0%,
        #f4c69f 45%,
        #d99d7b 100%
      );

    box-shadow:
      inset 0 1px rgba(255,255,255,.8),
      0 3px 5px rgba(0,0,0,.12);
}


/* little impact shadow belonging to each piece */

.layer::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-5px;
    width:70%;
    height:5px;
    transform:translateX(-50%) scaleX(.2);
    border-radius:50%;
    background:rgba(255,245,210,.28);
    opacity:0;
}


/* positions + timings */

.layer1{
    bottom:58px;
    animation:cakeDrop 1.15s cubic-bezier(.18,.75,.25,1) .15s forwards;
}
.layer1::after{animation:impactShadow .25s ease-out 1.05s forwards}

.layer2{
    bottom:77px;
    animation:cakeDrop 1.15s cubic-bezier(.18,.75,.25,1) .65s forwards;
}
.layer2::after{animation:impactShadow .25s ease-out 1.55s forwards}

.layer3{
    bottom:96px;
    animation:cakeDrop 1.15s cubic-bezier(.18,.75,.25,1) 1.15s forwards;
}
.layer3::after{animation:impactShadow .25s ease-out 2.05s forwards}

.layer4{
    bottom:115px;
    animation:cakeDrop 1.15s cubic-bezier(.18,.75,.25,1) 1.65s forwards;
}
.layer4::after{animation:impactShadow .25s ease-out 2.55s forwards}


/* ================= CAKE DROP ================= */

@keyframes cakeDrop{

    0%{
        opacity:0;
        transform:
          translateX(-50%)
          translateY(-220px)
          scaleX(.92)
          scaleY(1.12);
    }

    15%{
        opacity:1;
    }

    60%{
        transform:
          translateX(-50%)
          translateY(12px)
          scaleX(.96)
          scaleY(1.04);
    }

    /* impact squash */
    70%{
        transform:
          translateX(-50%)
          translateY(0)
          scaleX(1.12)
          scaleY(.72);
    }

    /* bounce */
    78%{
        transform:
          translateX(-50%)
          translateY(-8px)
          scaleX(.96)
          scaleY(1.08);
    }

    /* second impact */
    86%{
        transform:
          translateX(-50%)
          translateY(2px)
          scaleX(1.05)
          scaleY(.9);
    }

    /* tiny final bounce */
    93%{
        transform:
          translateX(-50%)
          translateY(-2px)
          scaleX(.99)
          scaleY(1.02);
    }

    100%{
        opacity:1;
        transform:
          translateX(-50%)
          translateY(0)
          scaleX(1)
          scaleY(1);
    }
}


@keyframes impactShadow{

    0%{
        opacity:0;
        transform:translateX(-50%) scaleX(.2);
    }

    50%{
        opacity:.65;
        transform:translateX(-50%) scaleX(1);
    }

    100%{
        opacity:0;
        transform:translateX(-50%) scaleX(1.2);
    }
}


/* ================= CREAM ================= */

.frosting{
    position:absolute;
    left:50%;
    width:164px;
    height:7px;

    opacity:0;

    transform:
      translateX(-50%)
      translateY(-100px)
      scaleX(.45)
      scaleY(1.8);

    border-radius:50% 50% 45% 45%;

    background:
      linear-gradient(
        to bottom,
        #fffbe3,
        #ffecc1
      );

    box-shadow:
      0 1px 4px rgba(255,245,210,.5),
      0 0 8px rgba(255,240,190,.2);

    z-index:12;
}


/* cream blobs */

.frosting::before,
.frosting::after{
    content:"";
    position:absolute;
    background:#fff1c9;
    border-radius:50%;
    opacity:.9;
}

.frosting::before{
    width:14px;
    height:8px;
    left:18px;
    top:1px;
    transform:rotate(-8deg);
}

.frosting::after{
    width:12px;
    height:7px;
    right:20px;
    top:0;
    transform:rotate(8deg);
}


.frost1{
    bottom:76px;
    animation:creamDrop .85s cubic-bezier(.15,.8,.25,1) 1.2s forwards;
}

.frost2{
    bottom:95px;
    animation:creamDrop .85s cubic-bezier(.15,.8,.25,1) 1.7s forwards;
}

.frost3{
    bottom:114px;
    animation:creamDrop .85s cubic-bezier(.15,.8,.25,1) 2.2s forwards;
}


@keyframes creamDrop{

    0%{
        opacity:0;
        transform:
          translateX(-50%)
          translateY(-100px)
          scaleX(.45)
          scaleY(1.8);
    }

    25%{
        opacity:1;
        transform:
          translateX(-50%)
          translateY(-55px)
          scaleX(.62)
          scaleY(1.55);
    }

    58%{
        transform:
          translateX(-50%)
          translateY(5px)
          scaleX(.85)
          scaleY(1.25);
    }

    /* soft cream impact */
    68%{
        transform:
          translateX(-50%)
          translateY(0)
          scaleX(1.18)
          scaleY(.48);
    }

    /* cream bounce */
    78%{
        transform:
          translateX(-50%)
          translateY(-5px)
          scaleX(.92)
          scaleY(1.12);
    }

    /* cream spreads */
    88%{
        transform:
          translateX(-50%)
          translateY(1px)
          scaleX(1.08)
          scaleY(.8);
    }

    100%{
        opacity:1;
        transform:
          translateX(-50%)
          translateY(0)
          scaleX(1)
          scaleY(1);
    }
}


/* ================= DECORATIONS ================= */

.decoration{
    position:absolute;
    width:11px;
    height:6px;
    border-radius:50%;
    background:#f5c29c;
    opacity:0;
    z-index:15;
}

.d1{left:88px;bottom:82px;animation:decorationIn .3s ease 2.35s forwards}
.d2{left:119px;bottom:82px;animation:decorationIn .3s ease 2.45s forwards}
.d3{left:145px;bottom:82px;animation:decorationIn .3s ease 2.55s forwards}
.d4{left:101px;bottom:101px;animation:decorationIn .3s ease 2.4s forwards}
.d5{left:135px;bottom:101px;animation:decorationIn .3s ease 2.5s forwards}

@keyframes decorationIn{
    from{opacity:0;transform:scale(0)}
    to{opacity:1;transform:scale(1)}
}


/* ================= PLATE ================= */

.plate{
    position:absolute;
    left:50%;
    bottom:51px;
    width:195px;
    height:4px;
    transform:translateX(-50%) scaleX(0);
    border-radius:50%;
    background:#fffde8;
    box-shadow:0 0 8px rgba(255,250,220,.7);
    z-index:20;
    animation:plateIn .55s ease 2.55s forwards;
}

@keyframes plateIn{
    0%{
        opacity:0;
        transform:translateX(-50%) scaleX(0);
    }
    100%{
        opacity:1;
        transform:translateX(-50%) scaleX(1);
    }
}


/* ================= CANDLE ================= */

.candle{
    position:absolute;
    left:50%;
    bottom:116px;
    width:5px;
    height:44px;

    transform:
      translateX(-50%)
      scaleY(0);

    transform-origin:bottom;

    background:
      linear-gradient(
        to right,
        #e9dfbe,
        #fffce0,
        #e8dcb7
      );

    border-radius:3px;
    z-index:30;

    box-shadow:0 0 5px rgba(255,250,220,.5);

    animation:
      candleIn .55s cubic-bezier(.2,.9,.25,1) 2.75s forwards;
}

@keyframes candleIn{
    0%{
        transform:translateX(-50%) scaleY(0);
    }
    70%{
        transform:translateX(-50%) scaleY(1.1);
    }
    100%{
        transform:translateX(-50%) scaleY(1);
    }
}


/* ================= WICK ================= */

.wick{
    position:absolute;
    width:2px;
    height:7px;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    background:#444;
    border-radius:3px;
}


/* ================= FLAME ================= */

.flame{
    position:absolute;
    left:50%;
    top:-35px;
    width:23px;
    height:33px;

    transform:
      translateX(-50%)
      scale(0);

    transform-origin:bottom center;

    background:#fffde7;

    border-radius:
      70% 30% 65% 35% /
      65% 45% 55% 35%;

    filter:blur(.2px);

    box-shadow:
      0 0 8px rgba(255,255,230,1),
      0 0 20px rgba(255,245,180,.7),
      0 0 40px rgba(255,225,100,.3);

    z-index:40;

    animation:
      flameIn .6s cubic-bezier(.2,.8,.2,1) 3.15s forwards,
      flicker .16s ease-in-out 3.8s infinite alternate;
}

.flame::before{
    content:"";
    position:absolute;
    width:12px;
    height:20px;
    left:5px;
    bottom:0;
    background:#fff;
    border-radius:65% 35% 60% 40%;
}

.flame::after{
    content:"";
    position:absolute;
    width:7px;
    height:13px;
    left:8px;
    bottom:1px;
    background:#fff;
    border-radius:60% 40% 60% 40%;
}

@keyframes flameIn{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(0);
    }
    70%{
        opacity:1;
        transform:translateX(-50%) scale(1.15);
    }
    100%{
        opacity:1;
        transform:translateX(-50%) scale(1);
    }
}

@keyframes flicker{
    from{
        transform:
          translateX(-50%)
          scale(1)
          rotate(-4deg);
    }
    to{
        transform:
          translateX(-50%)
          scale(.92,1.08)
          rotate(5deg);
    }
}


/* ================= MESSAGE ================= */

.message{
    position:relative;
    text-align:center;
    margin-top:-8px;

    opacity:0;
    transform:translateY(10px);

    z-index:50;

    animation:
      messageIn .9s ease 3.4s forwards;
}

.birthday{
    color:#ffb7a2;
    font-size:14px;
    font-style:italic;
    font-weight:500;
    letter-spacing:-.2px;
    text-shadow:0 0 8px rgba(255,160,135,.15);
}

.name{
    margin-top:11px;
    color:#ffb7a2;
    font-size:11px;
    font-style:italic;
    text-shadow:0 0 8px rgba(255,160,135,.15);
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* ================= BUTTON ================= */

.replay{
    position:absolute;
    right:20px;
    bottom:20px;

    padding:8px 15px;

    border-radius:20px;
    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.04);

    color:rgba(255,220,205,.7);

    font-size:11px;

    cursor:pointer;

    opacity:0;

    transition:.25s ease;
}

.scene:hover .replay{
    opacity:1;
}

.replay:hover{
    background:rgba(255,255,255,.1);
}

.hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    color:rgba(255,255,255,.2);
    font-size:9px;

    opacity:0;
    transition:.3s;
}

.scene:hover .hint{
    opacity:1;
}




/* =========================================================
   SPARKLES AFTER CANDLE IS BLOWN
========================================================= */

.sparkle-container{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:80;
    opacity:0;
    transition:opacity .2s ease;
}

.sparkle-container.active{
    opacity:1;
}

.sparkle{
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff8d9;
    box-shadow:
        0 0 5px #fff7d2,
        0 0 12px rgba(255,221,160,.9);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
}

.sparkle::before,
.sparkle::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    background:#fff6d5;
    transform:translate(-50%,-50%);
    border-radius:50%;
}

.sparkle::before{
    width:2px;
    height:18px;
}

.sparkle::after{
    width:18px;
    height:2px;
}

.sparkle.big{
    width:7px;
    height:7px;
}

.sparkle.big::before{
    height:28px;
}

.sparkle.big::after{
    width:28px;
}

.sparkle.active{
    animation:sparklePop var(--duration) cubic-bezier(.15,.8,.2,1) var(--delay) forwards;
}

@keyframes sparklePop{
    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.05)
            rotate(0deg);
    }

    12%{
        opacity:1;
    }

    45%{
        opacity:1;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.15)
            rotate(45deg);
    }

    75%{
        opacity:.75;
        transform:
            translate(
                calc(-50% + var(--x2)),
                calc(-50% + var(--y2))
            )
            scale(.72)
            rotate(100deg);
    }

    100%{
        opacity:0;
        transform:
            translate(
                calc(-50% + var(--x3)),
                calc(-50% + var(--y3))
            )
            scale(0)
            rotate(160deg);
    }
}

/* A soft flash behind the sparkles */
.sparkle-container::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,239,190,.85);
    transform:translate(-50%,-50%) scale(0);
    filter:blur(12px);
}

.sparkle-container.active::before{
    animation:sparkleFlash .75s ease-out forwards;
}

@keyframes sparkleFlash{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }
    20%{
        opacity:.9;
        transform:translate(-50%,-50%) scale(5);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(12);
    }
}


/* ================= BLOW / FINAL MESSAGE ================= */

.blown-out .flame {
    animation: flameOut .45s ease forwards !important;
}

.blown-out .candle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -10px;
    width: 3px;
    height: 15px;
    transform: translateX(-50%);
    background: rgba(235,235,220,.25);
    border-radius: 50%;
    filter: blur(2px);
    animation: smokeRise 1.8s ease-out forwards;
}

@keyframes flameOut {
    0% {
        opacity: 1;
        transform: translateX(-50%) scale(1) rotate(0);
        filter: blur(.2px);
    }
    35% {
        opacity: .8;
        transform: translateX(-54%) scale(1.25,.7) rotate(-10deg);
    }
    100% {
        opacity: 0;
        transform: translateX(-45%) translateY(8px) scale(.05,.15) rotate(18deg);
        filter: blur(3px);
        box-shadow: none;
    }
}

@keyframes smokeRise {
    0% {
        opacity: 0;
        transform: translateX(-50%) translateY(0) scale(.4);
    }
    25% {
        opacity: .45;
    }
    100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-35px) scale(2);
    }
}

.blow-message {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, calc(-50% + 110px)) scale(.85);
    width: min(92vw, 900px);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
}

.big-birthday {
    color: #ffd0c1;
    margin-bottom: 300px;
    font-size: clamp(25px, 5vw, 58px);
    font-weight: 700;
    letter-spacing: .04em;
    text-shadow:
        0 0 8px rgba(255,190,170,.35),
        0 0 25px rgba(255,140,120,.25);
}

.big-birthday span {
    display: inline-block;
    color: #ff9c91;
    margin-left: .08em;
    animation: heartBeat 1s ease-in-out infinite alternate;
}

@keyframes heartBeat {
    from { transform: scale(1); }
    to { transform: scale(1.18); }
}

.blow-message.show {
    animation: finalMessageIn 1.1s cubic-bezier(.2,.85,.2,1) forwards;
}

@keyframes finalMessageIn {
    0% {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 110px)) scale(.72);
        filter: blur(8px);
    }
    60% {
        opacity: 1;
        transform: translate(-50%, calc(-50% - 3px)) scale(1.04);
        filter: blur(0);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: blur(0);
    }
}

.initial-message.hide {
    animation: initialMessageOut .45s ease forwards;
}

@keyframes initialMessageOut {
    to {
        opacity: 0;
        transform: translateY(12px) scale(.95);
    }
}

.mic-status {
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    color: rgba(255,225,215,.42);
    font-size: 10px;
    letter-spacing: .02em;
    transition: opacity .5s ease;
    z-index: 110;
    white-space: nowrap;
}

.mic-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffb5a0;
    box-shadow: 0 0 8px rgba(255,170,150,.7);
    animation: micPulse 1s ease-in-out infinite alternate;
}

@keyframes micPulse {
    from { opacity: .35; transform: scale(.8); }
    to { opacity: 1; transform: scale(1.15); }
}

.mic-status.done {
    opacity: 0;
    pointer-events: none;
}

.scene.candle-out {
    cursor: default;
}

@media(max-width:600px) {
    .blow-message {
        width: 96vw;
    }

    .big-birthday {
        line-height: 1.15;
    }

    .mic-status {
        bottom: 25px;
        font-size: 9px;
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .cake-container{
        transform:
          translateY(-15px)
          scale(.85);
    }

    .message{
        margin-top:-25px;
    }

    .replay{
        opacity:.7;
    }
}


/* ================= REDUCED MOTION ================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:1ms!important;
        animation-iteration-count:1!important;
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <!-- Sparkles/fireworks appear after the candle is blown out -->
    <div class="sparkle-container" id="sparkleContainer"></div>

    <div class="cake-container">

        <div class="cake">

            <!-- CAKE PIECES -->
            <div class="layer layer1"></div>
            <div class="layer layer2"></div>
            <div class="layer layer3"></div>
            <div class="layer layer4"></div>

            <!-- CREAM -->
            <div class="frosting frost1"></div>
            <div class="frosting frost2"></div>
            <div class="frosting frost3"></div>

            <!-- DECORATIONS -->
            <div class="decoration d1"></div>
            <div class="decoration d2"></div>
            <div class="decoration d3"></div>
            <div class="decoration d4"></div>
            <div class="decoration d5"></div>

            <!-- CANDLE -->
            <div class="candle">
                <div class="wick"></div>
                <div class="flame"></div>
            </div>

            <!-- PLATE -->
            <div class="plate"></div>

        </div>
    </div>


    <!-- MESSAGE -->

    <div class="message initial-message">
        <div class="birthday">happy birthday!</div>
        <div class="name">Lovie</div>
    </div>

    <div class="blow-message" id="blowMessage">
        <div class="big-birthday">HAPPY BIRTHDAY AYUSHI <span>♥</span></div>
    </div>

    <div class="mic-status" id="micStatus">
        <span class="mic-dot"></span>
        <span id="micText">Allow microphone to blow out the candle</span>
    </div>


    <!-- REPLAY -->

    <button class="replay" id="replay">
        ↻ replay
    </button>

    <div class="hint">
        tap anywhere to replay
    </div>

</div>


<script>
/* =========================================================
   BLOW THE CANDLE
   Uses the microphone to detect a short, strong burst of air.
========================================================= */

const scene = document.getElementById("scene");
const replay = document.getElementById("replay");
const flame = document.querySelector(".flame");
const initialMessage = document.querySelector(".initial-message");
const blowMessage = document.getElementById("blowMessage");
const micStatus = document.getElementById("micStatus");
const micText = document.getElementById("micText");
const sparkleContainer = document.getElementById("sparkleContainer");

let audioContext = null;
let analyser = null;
let microphone = null;
let audioStream = null;
let blowDetector = null;
let blown = false;
let cooldown = false;



/* ---------------------------------------------------------
   Sparkle burst
--------------------------------------------------------- */

function createSparkleBurst(){

    sparkleContainer.innerHTML = "";
    sparkleContainer.classList.add("active");

    const total = 42;

    for(let i = 0; i < total; i++){

        const sparkle = document.createElement("span");

        sparkle.className =
            "sparkle" + (i % 7 === 0 ? " big" : "");

        const angle =
            (Math.PI * 2 / total) * i +
            (Math.random() - .5) * .45;

        const distance =
            90 + Math.random() * 230;

        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        const x2 = Math.cos(angle) * (distance + 35);
        const y2 = Math.sin(angle) * (distance + 35);

        const x3 = Math.cos(angle) * (distance + 65);
        const y3 = Math.sin(angle) * (distance + 65);

        sparkle.style.setProperty("--x", `${x}px`);
        sparkle.style.setProperty("--y", `${y}px`);
        sparkle.style.setProperty("--x2", `${x2}px`);
        sparkle.style.setProperty("--y2", `${y2}px`);
        sparkle.style.setProperty("--x3", `${x3}px`);
        sparkle.style.setProperty("--y3", `${y3}px`);

        sparkle.style.setProperty(
            "--delay",
            `${Math.random() * .18}s`
        );

        sparkle.style.setProperty(
            "--duration",
            `${.9 + Math.random() * .8}s`
        );

        sparkle.style.left =
            `${50 + (Math.random() - .5) * 4}%`;

        sparkle.style.top =
            `${50 + (Math.random() - .5) * 4}%`;

        sparkleContainer.appendChild(sparkle);

        requestAnimationFrame(() => {
            sparkle.classList.add("active");
        });
    }

    /*
      Second smaller wave gives the background a
      celebratory sparkle-pop rather than one burst.
    */
    setTimeout(() => {

        for(let i = 0; i < 24; i++){

            const sparkle = document.createElement("span");

            sparkle.className =
                "sparkle" + (i % 8 === 0 ? " big" : "");

            const angle = Math.random() * Math.PI * 2;
            const distance = 170 + Math.random() * 260;

            sparkle.style.setProperty(
                "--x",
                `${Math.cos(angle) * distance}px`
            );

            sparkle.style.setProperty(
                "--y",
                `${Math.sin(angle) * distance}px`
            );

            sparkle.style.setProperty(
                "--x2",
                `${Math.cos(angle) * (distance + 35)}px`
            );

            sparkle.style.setProperty(
                "--y2",
                `${Math.sin(angle) * (distance + 35)}px`
            );

            sparkle.style.setProperty(
                "--x3",
                `${Math.cos(angle) * (distance + 65)}px`
            );

            sparkle.style.setProperty(
                "--y3",
                `${Math.sin(angle) * (distance + 65)}px`
            );

            sparkle.style.setProperty(
                "--delay",
                `${Math.random() * .15}s`
            );

            sparkle.style.setProperty(
                "--duration",
                `${1 + Math.random() * .8}s`
            );

            sparkleContainer.appendChild(sparkle);

            requestAnimationFrame(() => {
                sparkle.classList.add("active");
            });
        }

    }, 280);
}


/* ---------------------------------------------------------
   Restart the visual animation
--------------------------------------------------------- */

function restartAnimation() {

    blown = false;
    cooldown = false;

    scene.classList.remove("blown-out", "candle-out");

    sparkleContainer.classList.remove("active");
    sparkleContainer.innerHTML = "";

    blowMessage.classList.remove("show");
    initialMessage.classList.remove("hide");

    micStatus.classList.remove("done");
    micText.textContent = "Allow microphone to blow out the candle";

    const elements = scene.querySelectorAll(
        ".layer, .frosting, .decoration, .plate, .candle, .flame, .message"
    );

    elements.forEach(element => {
        element.style.animation = "none";
    });

    void scene.offsetWidth;

    elements.forEach(element => {
        element.style.animation = "";
    });

    startBlowDetection();
}


/* ---------------------------------------------------------
   Blow detection
--------------------------------------------------------- */

async function startBlowDetection() {

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        micText.textContent = "Microphone is unavailable — try Chrome/Edge";
        return;
    }

    try {

        if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
        }

        audioStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();

        analyser = audioContext.createAnalyser();

        /*
          Small FFT gives us a responsive volume reading.
        */
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.12;

        microphone =
            audioContext.createMediaStreamSource(audioStream);

        microphone.connect(analyser);

        const data = new Uint8Array(analyser.fftSize);

        let loudFrames = 0;
        let lastBlow = 0;

        function detect() {

            if (!analyser || blown) return;

            analyser.getByteTimeDomainData(data);

            let sum = 0;

            for (let i = 0; i < data.length; i++) {
                const value = (data[i] - 128) / 128;
                sum += value * value;
            }

            const rms = Math.sqrt(sum / data.length);

            /*
              A blow normally produces a quick sustained burst.
              We require several consecutive loud frames so a
              random click doesn't extinguish the candle.
            */
            if (rms > 0.075) {
                loudFrames++;
            } else {
                loudFrames = Math.max(0, loudFrames - 2);
            }

            const now = performance.now();

            if (
                loudFrames >= 5 &&
                now - lastBlow > 1400
            ) {
                lastBlow = now;
                extinguishCandle();
                return;
            }

            blowDetector = requestAnimationFrame(detect);
        }

        micText.textContent =
            "Blow toward your microphone to extinguish the candle";

        detect();

    } catch (error) {

        console.log("Microphone permission/error:", error);

        micText.textContent =
            "Microphone blocked — allow it in your browser";
    }
}


/* ---------------------------------------------------------
   Extinguish candle
--------------------------------------------------------- */

function extinguishCandle() {

    if (blown || cooldown) return;

    blown = true;
    cooldown = true;

    scene.classList.add("blown-out");
    scene.classList.add("candle-out");

    /* Sparkles pop into the background as the flame goes out */
    createSparkleBurst();

    initialMessage.classList.add("hide");

    /*
      Wait until the flame has visually disappeared before
      showing the final birthday message.
    */
    setTimeout(() => {

        blowMessage.classList.add("show");
        micStatus.classList.add("done");

    }, 420);

    /*
      Stop microphone after successful blow.
    */
    if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
    }

    if (audioContext) {
        audioContext.close().catch(() => {});
    }

    if (blowDetector) {
        cancelAnimationFrame(blowDetector);
    }
}


/* ---------------------------------------------------------
   Replay button
--------------------------------------------------------- */

replay.addEventListener("click", event => {

    event.stopPropagation();

    restartAnimation();

});


/*
  Do NOT use click anywhere as the blow trigger.
  Clicking only restarts after the candle has already
  been extinguished, making the candle interaction
  microphone-based.
*/
scene.addEventListener("click", event => {

    if (event.target.closest(".replay")) return;

    if (blown) {
        restartAnimation();
    }

});


/* ---------------------------------------------------------
   Keyboard replay
--------------------------------------------------------- */

document.addEventListener("keydown", event => {

    if (
        event.code === "Space" ||
        event.code === "Enter"
    ) {

        if (blown) {
            restartAnimation();
        }

    }

});


/* ---------------------------------------------------------
   Start microphone detection after the page loads.
   Browser will ask for microphone permission.
--------------------------------------------------------- */

window.addEventListener("load", () => {

    setTimeout(() => {
        startBlowDetection();
    }, 3600);

});
</script>
